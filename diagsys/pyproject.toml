[project]
name = "diagsys"
version = "0.1.0"
description = "Universal local multi-agent system for machine diagnostics, prediction and prescription"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "psutil>=5.9",
    "numpy>=1.26",
    "duckdb>=1.1",
    "pyarrow>=15",
]

[project.optional-dependencies]
# Installed in later steps; declared here so the stack is visible from day one.
ml = ["scikit-learn", "lightgbm", "lifelines", "scipy"]  # K4-K5
llm = ["openai", "lancedb", "pypdf"]                     # K6 (client for llama.cpp/Ollama, RAG)
solver = ["ortools"]                                     # K7
app = ["langgraph", "fastapi", "uvicorn", "streamlit"]   # K8
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
diagsys = "diagsys.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diagsys"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Typer's documented style is typer.Option(...) / typer.Argument(...) in argument defaults.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
